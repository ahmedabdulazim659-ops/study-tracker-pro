<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study Tracker Pro</title>
  
  <!-- CSS Styles -->
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #1b3b6f;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px 10px;
    }

    .container {
      background-color: #ffffff;
      width: 100%;
      max-width: 480px;
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    }

    h1 {
      text-align: center;
      color: #1e3a8a;
      margin-bottom: 16px;
      font-size: 1.5rem;
    }

    /* Feedback Banner */
    .banner {
      background-color: #fef2f2;
      color: #991b1b;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 16px;
      text-align: center;
    }

    /* Stats */
    .stats-container {
      display: flex;
      justify-content: space-around;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 16px;
      text-align: center;
    }

    .stat-card p {
      font-size: 0.8rem;
      color: #6b7280;
    }

    .stat-card h3 {
      font-size: 1.2rem;
      color: #111827;
      margin-top: 4px;
    }

    /* Progress Bar */
    .progress-bar-container {
      width: 100%;
      height: 8px;
      background-color: #e5e7eb;
      border-radius: 4px;
      margin-bottom: 20px;
      overflow: hidden;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background-color: #10b981;
      transition: width 0.3s ease;
    }

    /* Inputs Form */
    .form-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 12px;
    }

    .form-container input {
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 0.95rem;
      outline: none;
    }

    #addBtn {
      background-color: #2563eb;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    #addBtn:hover {
      background-color: #1d4ed8;
    }

    /* History Button */
    .history-btn {
      width: 100%;
      background: linear-gradient(135deg, #4f46e5, #3b82f6);
      color: #fff;
      border: none;
      padding: 10px;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 16px;
      font-size: 0.95rem;
    }

    /* Task List */
    #taskList {
      list-style: none;
    }

    li {
      display: flex !important;
      align-items: center !important;
      justify-content: space-between !important;
      width: 100% !important;
      background-color: #f9fafb;
      border: 1px solid #f3f4f6;
      border-radius: 12px;
      padding: 10px 14px !important;
      margin-bottom: 10px !important;
      gap: 10px !important;
    }

    li.completed {
      opacity: 0.6;
      text-decoration: line-through;
    }

    .task-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
      cursor: pointer;
      flex-grow: 1;
    }

    .task-title {
      font-weight: 600;
      font-size: 0.95rem;
      color: #1f2937;
    }

    .task-meta {
      font-size: 0.8rem;
      color: #6b7280;
      white-space: nowrap;
    }

    /* Delete Button Styling */
    .delete-btn {
      width: 32px !important;
      height: 32px !important;
      min-width: 32px !important;
      max-width: 32px !important;
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
      background-color: #fee2e2 !important;
      color: #ef4444 !important;
      border: none !important;
      border-radius: 8px !important;
      cursor: pointer !important;
      font-size: 1.1rem !important;
      font-weight: bold !important;
      margin: 0 !important;
      padding: 0 !important;
      flex-shrink: 0 !important;
    }

    .delete-btn:hover {
      background-color: #ef4444 !important;
      color: #ffffff !important;
    }

    /* Mascot */
    .mascot-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 20px;
    }

    .speech-bubble {
      background-color: #ffffff;
      border: 1.5px solid #10b981;
      color: #065f46;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .mascot {
      font-size: 2.5rem;
    }

    /* Modal Styling */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(4px);
      align-items: center;
      justify-content: center;
    }

    .modal-content {
      background-color: #ffffff;
      padding: 20px;
      border-radius: 16px;
      width: 90%;
      max-width: 480px;
      max-height: 85vh;
      overflow-y: auto;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #e5e7eb;
      padding-bottom: 10px;
      margin-bottom: 15px;
    }

    .close-modal {
      font-size: 24px;
      cursor: pointer;
      color: #6b7280;
    }

    .history-filters {
      display: flex;
      gap: 8px;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }

    .history-filters select {
      flex: 1;
      min-width: 90px;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid #d1d5db;
      color: #1f2937 !important;
      background-color: #ffffff !important;
      font-weight: 600 !important;
      font-size: 0.85rem !important;
    }

    .day-summary {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      color: #1e40af;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 15px;
      text-align: center;
      font-weight: 600;
    }

    .history-card {
      background-color: #f9fafb;
      border-left: 4px solid #3b82f6;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 10px;
    }

    .history-card h4 {
      margin: 0 0 6px 0;
      color: #1f2937;
    }

    .history-card p {
      margin: 3px 0;
      font-size: 0.85rem;
      color: #4b5563;
    }

    .placeholder-text {
      text-align: center;
      color: #9ca3af;
      font-size: 0.85rem;
      padding: 20px 0;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Study Tracker Pro</h1>

    <!-- Feedback Banner -->
    <div id="feedbackBanner" class="banner">
      ⚠️ Completion rate is low! Work harder to reach your goal!
    </div>

    <!-- Dashboard Cards -->
    <div class="stats-container">
      <div class="stat-card">
        <p>Tasks Completed</p>
        <h3 id="completedCount">0 / 0</h3>
      </div>
      <div class="stat-card">
        <p>Total Study Time</p>
        <h3 id="totalMins">0 mins</h3>
      </div>
    </div>

    <!-- Progress Bar -->
    <div class="progress-bar-container">
      <div id="progressBar" class="progress-bar"></div>
    </div>

    <!-- Task Form -->
    <div class="form-container">
      <input type="text" id="taskInput" placeholder="Write Your Task?">
      <input type="number" id="minsInput" placeholder="Mins of Task">
      <button id="addBtn">Add Task</button>
    </div>

    <!-- Study History Button -->
    <button id="historyBtn" class="history-btn">📊 Study History</button>

    <!-- Task List -->
    <ul id="taskList"></ul>

    <!-- Footer Mascot -->
    <div class="mascot-container">
      <div class="speech-bubble">Organize Your Time! ⏱️</div>
      <div class="mascot">👦</div>
    </div>
  </div>

  <!-- Study History Modal -->
  <div id="historyModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>📅 Study History Log</h2>
        <span class="close-modal" id="closeHistoryModal">&times;</span>
      </div>
      
      <!-- Filters -->
      <div class="history-filters">
        <select id="yearSelect">
          <option value="">Select Year</option>
        </select>
        
        <select id="monthSelect" disabled>
          <option value="">Select Month</option>
        </select>

        <select id="daySelect" disabled>
          <option value="">Select Day</option>
        </select>
      </div>

      <!-- Day Summary -->
      <div id="daySummary" class="day-summary" style="display: none;">
        <p>⏱️ Total Study Time: <strong id="totalTimeText">0 mins</strong></p>
      </div>

      <!-- History Cards Container -->
      <div id="historyDisplayArea" class="history-display-area">
        <p class="placeholder-text">Please select a year, month, and day to view logs.</p>
      </div>
    </div>
  </div>

  <!-- JavaScript Logic -->
  <script>
    // Global State Variables
    let totalTasks = 0;
    let completedTasks = 0;
    let totalMinutes = 0;

    // Main UI Elements
    const taskInput = document.getElementById("taskInput");
    const minsInput = document.getElementById("minsInput");
    const addBtn = document.getElementById("addBtn");
    const taskList = document.getElementById("taskList");

    const completedCount = document.getElementById("completedCount");
    const totalMins = document.getElementById("totalMins");
    const progressBar = document.getElementById("progressBar");

    // History Modal Elements
    const historyBtn = document.getElementById("historyBtn");
    const historyModal = document.getElementById("historyModal");
    const closeHistoryModal = document.getElementById("closeHistoryModal");

    const yearSelect = document.getElementById("yearSelect");
    const monthSelect = document.getElementById("monthSelect");
    const daySelect = document.getElementById("daySelect");
    const daySummary = document.getElementById("daySummary");
    const totalTimeText = document.getElementById("totalTimeText");
    const historyDisplayArea = document.getElementById("historyDisplayArea");

    // Helper: Format Time Exactly Matching System Clock
    function getSystemFormattedTime(nowDate) {
      let hours = nowDate.getHours();
      const minutesStr = nowDate.getMinutes().toString().padStart(2, '0');
      const ampm = hours >= 12 ? 'PM' : 'AM';
      hours = hours % 12 || 12;
      return `${hours}:${minutesStr} ${ampm}`;
    }

    // 1. Add Task Event
    addBtn.addEventListener("click", function() {
      const name = taskInput.value.trim();
      const mins = parseInt(minsInput.value);

      if (!name || isNaN(mins) || mins <= 0) {
        alert("Please enter a valid task name and minutes!");
        return;
      }

      // Add Element to Main List
      createTaskElement(name, mins);

      // Save dynamic values to LocalStorage History
      saveTaskToHistory(name, mins);

      // Update Statistics
      totalTasks++;
      totalMinutes += mins;
      updateDashboard();

      // Reset Inputs
      taskInput.value = "";
      minsInput.value = "";
    });

    // 2. Create Task Item UI
    function createTaskElement(name, studyMins) {
      const li = document.createElement("li");

      const now = new Date();
      const currentTimeStr = getSystemFormattedTime(now);
      const formattedDate = `${now.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })} at ${currentTimeStr}`;

      const taskInfo = document.createElement("div");
      taskInfo.className = "task-info";
      taskInfo.innerHTML = `
        <div class="task-title">${name}</div>
        <div class="task-meta">⏱️ ${studyMins} mins | 📅 ${formattedDate}</div>
      `;

      // Toggle Complete
      taskInfo.addEventListener("click", function() {
        li.classList.toggle("completed");
        if (li.classList.contains("completed")) {
          completedTasks++;
        } else {
          completedTasks--;
        }
        updateDashboard();
      });

      // Delete Button (x)
      const delBtn = document.createElement("button");
      delBtn.className = "delete-btn";
      delBtn.innerHTML = "&times;";
      delBtn.onclick = function(e) {
        e.stopPropagation();
        if (li.classList.contains("completed")) {
          completedTasks--;
        }
        totalTasks--;
        totalMinutes -= studyMins;
        li.remove();
        updateDashboard();
      };

      li.appendChild(taskInfo);
      li.appendChild(delBtn);
      taskList.appendChild(li);
    }

    // 3. Update Stats & Progress Bar
    function updateDashboard() {
      completedCount.textContent = `${completedTasks} / ${totalTasks}`;
      totalMins.textContent = `${totalMinutes} mins`;
      const percentage = totalTasks === 0 ? 0 : (completedTasks / totalTasks) * 100;
      progressBar.style.width = `${percentage}%`;
    }

    // 4. Save Task to LocalStorage
    function saveTaskToHistory(taskName, minutes) {
      const now = new Date();
      const currentTimeStr = getSystemFormattedTime(now);

      const historyItem = {
        id: Date.now(),
        title: taskName,
        duration: parseInt(minutes),
        year: now.getFullYear().toString(),
        month: (now.getMonth() + 1).toString().padStart(2, '0'),
        day: now.getDate().toString().padStart(2, '0'),
        dayName: now.toLocaleDateString('en-US', { weekday: 'long' }),
        time: currentTimeStr,
        fullDate: now.toLocaleDateString('en-US')
      };

      let fullHistory = JSON.parse(localStorage.getItem("studyHistory")) || [];
      fullHistory.push(historyItem);
      localStorage.setItem("studyHistory", JSON.stringify(fullHistory));
    }

    // 5. Open Modal
    historyBtn.onclick = function() {
      historyModal.style.display = "flex";
      populateYearDropdown();
    };

    closeHistoryModal.onclick = function() {
      historyModal.style.display = "none";
    };

    window.onclick = function(event) {
      if (event.target == historyModal) {
        historyModal.style.display = "none";
      }
    };

    // Populate Year Filter
    function populateYearDropdown() {
      const fullHistory = JSON.parse(localStorage.getItem("studyHistory")) || [];
      const years = [...new Set(fullHistory.map(item => item.year))];
      
      yearSelect.innerHTML = '<option value="">Select Year</option>';
      monthSelect.innerHTML = '<option value="">Select Month</option>';
      daySelect.innerHTML = '<option value="">Select Day</option>';
      monthSelect.disabled = true;
      daySelect.disabled = true;
      daySummary.style.display = "none";

      years.forEach(year => {
        const opt = document.createElement("option");
        opt.value = year;
        opt.textContent = year;
        yearSelect.appendChild(opt);
      });
    }

    // Filter Year -> Enable Month
    yearSelect.onchange = function() {
      const selectedYear = this.value;
      monthSelect.innerHTML = '<option value="">Select Month</option>';
      daySelect.innerHTML = '<option value="">Select Day</option>';
      daySelect.disabled = true;
      daySummary.style.display = "none";
      
      if (!selectedYear) {
        monthSelect.disabled = true;
        historyDisplayArea.innerHTML = '<p class="placeholder-text">Please select a year, month, and day to view logs.</p>';
        return;
      }

      const fullHistory = JSON.parse(localStorage.getItem("studyHistory")) || [];
      const months = [...new Set(fullHistory.filter(i => i.year === selectedYear).map(i => i.month))];
      const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

      months.forEach(m => {
        const opt = document.createElement("option");
        opt.value = m;
        opt.textContent = monthNames[parseInt(m) - 1];
        monthSelect.appendChild(opt);
      });

      monthSelect.disabled = false;
    };

    // Filter Month -> Enable Day
    monthSelect.onchange = function() {
      const selectedYear = yearSelect.value;
      const selectedMonth = this.value;

      daySelect.innerHTML = '<option value="">Select Day</option>';
      daySummary.style.display = "none";

      if (!selectedMonth) {
        daySelect.disabled = true;
        return;
      }

      const fullHistory = JSON.parse(localStorage.getItem("studyHistory")) || [];
      const days = [...new Set(fullHistory.filter(i => i.year === selectedYear && i.month === selectedMonth).map(i => i.day))];

      days.sort((a, b) => a - b).forEach(d => {
        const opt = document.createElement("option");
        opt.value = d;
        opt.textContent = `Day ${d}`;
        daySelect.appendChild(opt);
      });

      daySelect.disabled = false;
    };

    // Filter Day -> Show Cards & Calculated Time
    daySelect.onchange = function() {
      const selectedYear = yearSelect.value;
      const selectedMonth = monthSelect.value;
      const selectedDay = this.value;

      if (!selectedDay) {
        daySummary.style.display = "none";
        historyDisplayArea.innerHTML = '<p class="placeholder-text">Please select a day to view sessions.</p>';
        return;
      }

      const fullHistory = JSON.parse(localStorage.getItem("studyHistory")) || [];
      const filtered = fullHistory.filter(i => 
        i.year === selectedYear && 
        i.month === selectedMonth && 
        i.day === selectedDay
      );

      if (filtered.length === 0) {
        historyDisplayArea.innerHTML = '<p class="placeholder-text">No study sessions logged for this day.</p>';
        daySummary.style.display = "none";
        return;
      }

      // Calculate Total Time
      const totalMinsForDay = filtered.reduce((acc, curr) => acc + (curr.duration || 0), 0);
      const hrs = Math.floor(totalMinsForDay / 60);
      const mins = totalMinsForDay % 60;
      
      let formattedTime = "";
      if (hrs > 0) formattedTime += `${hrs} hr `;
      formattedTime += `${mins} mins`;

      totalTimeText.textContent = formattedTime;
      daySummary.style.display = "block";

      let html = '';
      filtered.slice().reverse().forEach(item => {
        html += `
          <div class="history-card">
            <h4>📘 ${item.title}</h4>
            <p>⏱️ <strong>Duration:</strong> ${item.duration} mins</p>
            <p>📅 <strong>Day:</strong> ${item.dayName} (${item.fullDate})</p>
            <p>⏰ <strong>Time Added:</strong> ${item.time}</p>
          </div>
        `;
      });

      historyDisplayArea.innerHTML = html;
    };
  </script>
</body>
</html>
